[project]
name = "franc-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Frameworks franc is built on (floors = the versions the test suite runs against)
    "fastmcp>=4.1.3",
    "infrahub-sdk>=1.23.2",  # plain SDK — the [all] extra pulled in numpy, pyarrow, typer, rich, jinja2, ariadne-codegen...
    # Imported directly by franc; declared here rather than relying on transitive installs
    "httpx>=0.27",
    "mcp>=1.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "starlette>=0.40",
    # Features
    "asyncssh>=2.24.0",  # device SSH troubleshooting tools
    "gcf-python>=2.4.0",  # token-saving response compression
    "ntc-templates>=9.2.0",  # structured parsing of SSH show output
    "tiktoken>=0.12.0",  # decides whether GCF actually beats JSON on tokens
]

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.34",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.11.8",
    "ty>=0.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
      packages = ["franc"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
# The SDK registers its own pytest plugin (needs jinja2 etc. from the [all] extra); franc does not use it.
addopts = "-p no:pytest-infrahub"

[tool.ruff]
line-length = 120

exclude = [
    ".git",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
]


[tool.ruff.lint]
preview = true
ignore = [
    "S110",    # try/except/pass — intentional for optional schema fields
]

[tool.pymarkdown.plugins.md013]
enabled = true
line_length = 200
tables = false
code_blocks = false

[tool.pymarkdown.plugins.md024]
enabled = false

[tool.pymarkdown.plugins.md031]
enabled = false

[tool.pymarkdown.plugins.md032]
enabled = false

[tool.pymarkdown.plugins.md060]
enabled = false
