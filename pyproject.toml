[project]
name = "franc-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.24.0",
    "fastmcp>=2.10.5",
    "gcf-python>=2.4.0",
    "infrahub-sdk[all]>=1.13.3",
    "ntc-templates>=9.2.0",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.34",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.11.8",
    "ty>=0.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
      packages = ["franc"]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

exclude = [
    ".git",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
]


[tool.ruff.lint]
preview = true
ignore = [
    "EXE001",  # scripts run via `uv run`, not direct execution
    "S110",    # try/except/pass — intentional for optional schema fields
]

[tool.pymarkdown.plugins.md013]
enabled = true
line_length = 200
tables = false
code_blocks = false

[tool.pymarkdown.plugins.md024]
enabled = false

[tool.pymarkdown.plugins.md031]
enabled = false

[tool.pymarkdown.plugins.md032]
enabled = false

[tool.pymarkdown.plugins.md060]
enabled = false
